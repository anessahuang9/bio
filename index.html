<title>Anessa Huang</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:#111}
main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1rem;padding:1.5rem}
a{display:block;width:100%;max-width:32rem;padding:1.1rem 1.5rem;text-align:center;text-decoration:none;color:#111;background:#fff;border:2px solid #111;border-radius:999px;font:600 1.05rem/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .15s,color .15s,transform .15s}
a:hover{background:#111;color:#fff;transform:scale(1.02)}
a:focus-visible{outline:3px solid #111;outline-offset:3px}
@media (prefers-reduced-motion:reduce){a{transition:none}a:hover{transform:none}}
</style>
</head>
